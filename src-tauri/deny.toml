# cargo-deny — supply-chain gate for this crate's dependency graph.
#
#   nix shell nixpkgs#cargo-deny -c cargo-deny --offline check bans sources
#   nix shell nixpkgs#cargo-deny -c cargo-deny check advisories   # needs network
#
# Installed 2026-08-28 in response to the arrayref/crates.io compromise of
# 2026-08-20, in which three long-lived crates were republished with a
# dependency on a typosquat whose build.rs downloaded and executed a backdoor
# during `cargo build`. This machine was not affected — every lockfile here
# resolved arrayref 0.3.9, the release before the hijack — and this file exists
# so that remaining true does not depend on anyone remembering the incident.
#
# ## The [bans].deny list is generated, not hand-written
#
#     ~/Projects/rust-tooling/scan.sh --emit-deny
#
# from ~/Projects/rust-tooling/denylist.txt, which is the same file the
# on-demand scanner, the pre-commit hook and the Claude Code PreToolUse guard
# read. Regenerate rather than editing in place: four consumers disagreeing
# about what is banned is worse than none of them existing.
#
# ## Why the two kinds of entry are not interchangeable
#
# arrayref, internment and append-only-vec are real crates by a real maintainer
# whose crates.io credentials were compromised. Only the hijacked releases are
# banned, by exact version. Banning the names outright would break consumers
# for no security gain — two projects here legitimately depend on arrayref
# 0.3.9. The six bare names below have no legitimate release to preserve: they
# were registered by the attacker and every version has been deleted.
#
# ## The generic half, which matters more than the list
#
# A denylist only ever catches the incident it was written for. The three
# settings below are what would have caught this one before it had a name:
#
#   yanked = "deny"        The attack drove upgrades by yanking the stable
#                          releases. A dependency that has been yanked out from
#                          under the lockfile is a fact worth failing on,
#                          whether or not an advisory exists yet.
#   unknown-git = "deny"   A git dependency is a version that cannot be audited
#                          against the advisory database and cannot be
#                          reproduced from the lockfile with confidence.
#   allow-registry         crates.io and nothing else. An alternate registry is
#                          how a poisoned mirror gets in.

[graph]
all-features = false

[bans]
# Duplicate versions are a build-time cost here, not a security property.
multiple-versions = "allow"
# `warn`, not `deny`, and the reason is measured rather than cautious.
#
# A wildcard requirement on a *registry* crate is a genuine risk: the lockfile
# becomes the only thing deciding what gets compiled, which is the situation
# this incident exploited. A wildcard on a *path* or *workspace* dependency is
# not — it resolves to a directory in this repository, not to whatever crates.io
# serves today.
#
# cargo-deny 0.19.6 cannot tell them apart here. `allow-wildcard-paths = true`
# exists for exactly this, but measured 2026-08-28 it refuses to apply:
#
#   error[wildcard]: found 2 wildcard dependencies for crate 'totalctl'.
#   allow-wildcard-paths is enabled, but does not apply to public crates as
#   crates.io disallows path dependencies.
#
# The exemption only covers crates marked `publish = false`, and the internal
# members of totality-errchain, totality, Atrium and NPdesKtop are not. Four of
# eight projects fail on their own path dependencies.
#
# So the choice was `deny` plus editing four projects' publish metadata, or
# `warn`. Changing whether someone's crates are publishable is not a side effect
# a security config gets to have, and a gate that fails on the day it lands is a
# gate people learn to skip. The load-bearing checks in this file are
# [bans].deny, [sources] and yanked — none of which depends on this line.
#
# To tighten later: add `publish = false` to the internal workspace members,
# then set this to "deny" and add `allow-wildcard-paths = true`.
wildcards = "warn"

deny = [
  # --- generated by scan.sh --emit-deny; do not edit by hand ----------------
  { crate = "proc-macro1", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "proc-macro-en", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "aovine", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "arone", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "aronenao", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "tinymember", reason = "attacker-controlled crate, arrayref supply-chain compromise 2026-08-20" },
  { crate = "arrayref@=0.3.10", reason = "hijacked release, arrayref supply-chain compromise 2026-08-20; other versions are fine" },
  { crate = "internment@=0.8.7", reason = "hijacked release, arrayref supply-chain compromise 2026-08-20; other versions are fine" },
  { crate = "append-only-vec@=0.1.9", reason = "hijacked release, arrayref supply-chain compromise 2026-08-20; other versions are fine" },
  # --- end generated --------------------------------------------------------
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Requires the RUSTSEC database, so this check needs a network and is skipped by
# `--offline` runs. See the note above on why `yanked` is the load-bearing line.
yanked = "deny"
ignore = []

[licenses]
# Deliberately permissive: this file is a supply-chain gate, and turning it into
# a licence gate as well would mean the first unfamiliar-but-fine licence trains
# someone to pass --allow-licenses or delete the file. Tighten per-project if
# and when licence compliance is an actual requirement.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0",
  "MIT-0", "Unlicense", "MPL-2.0", "OpenSSL", "BSL-1.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.8
