[package]
name = "quark"
version = "0.2.4"
edition = "2021"
description = "A CLI-styled Matrix client"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
matrix-sdk = { version = "0.9", features = ["e2e-encryption", "sqlite"] }
toml = "0.8"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
reqwest = { version = "0.12", features = ["json"] }
mime = "0.3"
sha2 = "0.10"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "quark_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "quark"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# macOS Tahoe: objc2 debug assertions panic on removed NSApplicationDelegate methods
[profile.dev.package.objc2]
debug-assertions = false
[profile.dev.package.objc2-app-kit]
debug-assertions = false
[profile.dev.package.objc2-foundation]
debug-assertions = false
[profile.dev.package.objc2-web-kit]
debug-assertions = false
[profile.dev.package.block2]
debug-assertions = false
