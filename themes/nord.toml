[meta]
name = "Nord"
author = "quark"
version = "1.0"

[colors]
background = "#2e3440"
foreground = "#d8dee9"
cursor = "#88c0d0"
selection_bg = "#3b4252"
selection_fg = "#eceff4"
border = "#3b4252"

[colors.accent]
primary = "#88c0d0"
secondary = "#81a1c1"
error = "#bf616a"
warning = "#ebcb8b"
success = "#a3be8c"
link = "#5e81ac"

[colors.messages]
own = "#a3be8c"
other = "#d8dee9"
system = "#4c566a"
timestamp = "#434c5e"
mention_bg = "#3b3f4e"
mention_fg = "#ebcb8b"
reply_border = "#4c566a"
thread_indicator = "#81a1c1"

[colors.roomlist]
active_bg = "#3b4252"
active_fg = "#88c0d0"
unread = "#eceff4"
mention_badge = "#bf616a"
muted = "#4c566a"

[colors.reactions]
background = "#3b4252"
border = "#434c5e"
own_bg = "#3a4a3a"
count = "#4c566a"

# Code block syntax highlighting. A key left out falls back to a colour
# derived from the palette above.
# Nord's syntax palette, a shade below nord0. Meta uses nord12 (Nord's
# annotation colour) and comment/deletion are nudged lighter, so every token
# clears 4.5:1 (comments 3:1).
[colors.syntax]
background = "#242933"
foreground = "#d8dee9"
border = "#3b4252"
comment = "#66738d"
keyword = "#81a1c1"
string = "#a3be8c"
number = "#b48ead"
constant = "#81a1c1"
builtin = "#88c0d0"
type = "#8fbcbb"
function = "#88c0d0"
variable = "#d8dee9"
attribute = "#8fbcbb"
tag = "#81a1c1"
operator = "#81a1c1"
punctuation = "#eceff4"
escape = "#ebcb8b"
meta = "#d08770"
regexp = "#ebcb8b"
section = "#88c0d0"
addition = "#a3be8c"
deletion = "#d4747c"

[typography]
font_family = "JetBrains Mono, Fira Code, monospace"
font_size = 14
line_height = 1.5
message_spacing = 4

[borders]
style = "single"
room_list_width = "25%"

[emoji]
size = 32
sticker_max_size = 256
reaction_size = 20

[prompt]
symbol = ":>"
normal_indicator = "NOR"
insert_indicator = "INS"
command_indicator = "CMD"
visual_indicator = "VIS"
