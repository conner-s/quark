# Quark — Tauri v2 CI/CD Pipeline
#
# Produces installable artifacts for Linux, Windows, macOS, and Android.
# Pipeline only runs on tag pushes; each build uploads its bundles to the
# project's Generic Package Registry so the resulting Release links point to
# permanent, externally-accessible copies (not job-artifact URLs that expire).
#
# Runner requirements:
#   Linux:   Any runner with Docker executor (handled via image: below)
#   Windows: A shell-executor runner tagged "windows" with:
#              - Rust (stable), pnpm, Node 20, MSVC build tools, WebView2 SDK
#   macOS:   A shell-executor runner tagged "macos" with:
#              - Rust (stable), pnpm, Node 20, Xcode CLT
#   Android: Any Linux Docker runner (image installs SDK/NDK/JDK on demand)

stages:
  - test
  - build
  - release

# ─── pipeline-level gating ──────────────────────────────────────────────────
#
# Pipelines fire on:
#   • tag pushes        → full test + build + release (see per-job rules below)
#   • merge requests    → test/lint only (build & release are tag-gated)
#   • branch pushes      → test/lint only
#   • main pushes        → skipped (see below)
#
# main is merged fast-forward-only, so every commit that lands on main is the
# exact commit that already passed test/lint in its MR pipeline. Re-running on
# the main push would be pure duplication, so the main rule skips it outright.
#
# The $CI_OPEN_MERGE_REQUESTS rule suppresses the duplicate *branch* pipeline
# that would otherwise run alongside the MR pipeline for any branch with an
# open MR (GitLab's canonical "avoid duplicate pipelines" guard).

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ─── shared defaults ────────────────────────────────────────────────────────

default:
  interruptible: true

variables:
  CARGO_TERM_COLOR: always
  # Keep incremental artefacts out of the source tree so caches stay clean.
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/src-tauri/target
  # Put CARGO_HOME inside the workspace. GitLab only caches paths under
  # $CI_PROJECT_DIR, so the previous $HOME/.cargo/* cache paths were silently
  # skipped and crates re-downloaded on every job. Relocating it here makes the
  # crate registry/cache genuinely cacheable.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Parallel cache (de)compression. The default single-threaded gzip is the main
  # reason large Rust caches were slow to archive and extract; fastzip + the
  # fastest level cut that dramatically.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  # Generic Package Registry base URL for this tag.
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/quark/${CI_COMMIT_TAG}"

# ─── cache templates ────────────────────────────────────────────────────────
#
# Each Rust job uses two caches:
#
#   1. The cargo registry/index/git dirs — SHARED across every job (keyed only
#      on Cargo.lock via the `cargo_registry_cache` anchor below). Small, stable,
#      and image-independent, so one download warms every job's crate sources.
#
#   2. A per-job `target/` cache with its OWN key prefix (defined inline in each
#      job). Previously test, lint and build:linux all shared one `rust-linux`
#      key under the default pull-push policy, so they mixed debug + release
#      artifacts into a single ballooning archive and raced to overwrite it on
#      every pipeline. Separate prefixes keep each job's archive lean and stop
#      the thrash.
#
# All paths live under $CI_PROJECT_DIR (CARGO_HOME is relocated there), so
# GitLab actually caches them — unlike the old $HOME/.cargo/* paths.

.cargo_registry_cache: &cargo_registry_cache
  key:
    files:
      - src-tauri/Cargo.lock
    prefix: cargo-registry
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/

# ─── upload helper ──────────────────────────────────────────────────────────
#
# Usage in a script step:
#   - upload_to_registry "<source-glob>" "<dest-filename>"
#
# `dest-filename` is the name under which the file will live in the registry
# (and the name that ends up on the Release page). It must be predictable so
# the `release` job can link to it.

.upload_helper: &upload_helper |
  upload_to_registry() {
    local src_glob="$1"
    local dest_name="$2"
    local file
    file=$(ls -1 $src_glob 2>/dev/null | head -n1 || true)
    if [ -z "$file" ] || [ ! -f "$file" ]; then
      echo "upload_to_registry: no file matched '$src_glob'" >&2
      return 1
    fi
    echo "Uploading $file → $dest_name"
    curl --fail-with-body --silent --show-error \
         --header "JOB-TOKEN: $CI_JOB_TOKEN" \
         --upload-file "$file" \
         "$PACKAGE_REGISTRY_URL/$dest_name"
    echo
  }

# ─── test ───────────────────────────────────────────────────────────────────
#
# Hard gate. Runs on every pipeline (tags, MRs, branch pushes). `pnpm build`
# in before_script also type-checks the frontend (tsc), so a type error fails
# the job before the test step is reached.

test:
  stage: test
  image: node:20-bookworm-slim
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-test
      paths:
        - src-tauri/target/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates
        curl
        build-essential
        pkg-config
        libssl-dev
        libsqlite3-dev
        libgtk-3-dev
        libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev
        libwebkit2gtk-4.1-dev
    # Install Rust
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
    # Install pnpm + deps
    - corepack enable
    # Honour the "packageManager" field in package.json (pnpm 10.x — pnpm 11
    # requires Node 22.13+, which this image doesn't ship).
    - corepack install
    - pnpm install --frozen-lockfile
    - pnpm build
  script:
    - pnpm test
    - cargo test --manifest-path src-tauri/Cargo.toml

# ─── lint (advisory) ──────────────────────────────────────────────────────────
#
# Runs clippy but does NOT block the pipeline (allow_failure). The backend
# currently carries ~31 pre-existing clippy warnings and uses a deliberate
# hand-formatting style that diverges from rustfmt's default, so neither
# `clippy -D warnings` nor `cargo fmt --check` can be a hard gate yet. This job
# keeps the signal visible (and lets new warnings stand out) without forcing a
# codebase-wide cleanup. Promote to a hard gate (`-D warnings`) once the
# existing warnings are cleared.

lint:
  stage: test
  image: rust:slim-bookworm
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-clippy
      paths:
        - src-tauri/target/
  allow_failure: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates
        pkg-config
        libssl-dev
        libsqlite3-dev
        libgtk-3-dev
        libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev
        libwebkit2gtk-4.1-dev
    - rustup component add clippy
    # `tauri::generate_context!()` embeds the frontend bundle at compile time and
    # panics if frontendDist (../dist) is missing. The `test` job gets a real
    # dist/ from `pnpm build`; clippy doesn't need the built assets, so a
    # placeholder lets the proc-macro expand and the Rust actually gets linted.
    - mkdir -p dist
    - echo '<!doctype html><title>quark</title>' > dist/index.html
  script:
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

# ─── build: Linux ───────────────────────────────────────────────────────────
#
# Produces: .deb, .AppImage, .rpm (whatever Tauri's "all" target emits).

build:linux:
  stage: build
  image: ubuntu:22.04
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-release-linux
      paths:
        - src-tauri/target/
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates
        curl
        file
        build-essential
        pkg-config
        libssl-dev
        libsqlite3-dev
        libgtk-3-dev
        libglib2.0-dev
        libwebkit2gtk-4.1-dev
        libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev
        librsvg2-dev
        patchelf
        libxdo-dev
        libayatana-appindicator3-dev
        xdg-utils
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    # Honour the "packageManager" field in package.json (pnpm 10.x — pnpm 11
    # requires Node 22.13+, which this image doesn't ship).
    - corepack install
    - pnpm install --frozen-lockfile
  script:
    - *upload_helper
    - pnpm tauri build
    - upload_to_registry "src-tauri/target/release/bundle/deb/*.deb"           "quark-${CI_COMMIT_TAG}-linux-amd64.deb"
    - upload_to_registry "src-tauri/target/release/bundle/appimage/*.AppImage" "quark-${CI_COMMIT_TAG}-linux-amd64.AppImage"
    - upload_to_registry "src-tauri/target/release/bundle/rpm/*.rpm"           "quark-${CI_COMMIT_TAG}-linux-x86_64.rpm"
  artifacts:
    name: "quark-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/rpm/*.rpm
    expire_in: 30 days

# ─── build: Flatpak ─────────────────────────────────────────────────────────
#
# Produces: quark.flatpak (single-file bundle).
# Runner needs Docker executor with privileged = true (bubblewrap requires
# user namespaces). Runtimes (~1 GB) are cached after the first run.

build:flatpak:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      prefix: flatpak-runtimes-gnome50
      files:
        - flatpak/zone.derg.quark.yml
    paths:
      - .flatpak-runtime-cache/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        flatpak flatpak-builder
        ca-certificates curl
        nodejs npm
        elfutils
    # pnpm 11 requires Node 22.13+; this image ships Node 20. Pin to 10.x to match package.json.
    - npm install -g pnpm@10
    - |
      if [ -d .flatpak-runtime-cache ]; then
        cp -a .flatpak-runtime-cache/. /var/lib/flatpak/ 2>/dev/null || true
      fi
    - flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - flatpak install --system -y flathub
        org.gnome.Platform//50
        org.gnome.Sdk//50
        org.freedesktop.Sdk.Extension.rust-stable//25.08
        org.freedesktop.Sdk.Extension.node22//25.08
    - cp -a /var/lib/flatpak/. .flatpak-runtime-cache/
    - pnpm install --frozen-lockfile
  script:
    - *upload_helper
    - flatpak-builder --force-clean --repo=flatpak-repo flatpak-build flatpak/zone.derg.quark.yml
    - flatpak build-bundle flatpak-repo quark.flatpak zone.derg.quark
    - upload_to_registry "quark.flatpak" "quark-${CI_COMMIT_TAG}.flatpak"
  artifacts:
    name: "quark-flatpak-$CI_COMMIT_SHORT_SHA"
    paths:
      - quark.flatpak
    expire_in: 30 days

# ─── build: Windows (cross-compiled from Linux) ─────────────────────────────
#
# No Windows runner: this cross-compiles to x86_64-pc-windows-msvc on a Linux
# Docker runner via cargo-xwin, and bundles only the NSIS .exe installer.
# (MSI/WiX can't be produced off-Windows; non-Android deps use native-tls →
# SChannel and bundled-sqlite, so no OpenSSL/system libs are needed.)
# Produces: .exe (NSIS installer).
#
# NB: we select NSIS via `--config` (bundle.targets), NOT the `--bundles` flag.
# The CLI validates `--bundles` values against the *host* OS, so on a Linux
# host `--bundles nsis` is rejected ("possible values: deb, rpm, appimage").
# The config override isn't host-gated, and pinning targets to ["nsis"] also
# stops the bundler from attempting the (Windows-only) MSI/WiX step.

build:windows:
  stage: build
  image: ubuntu:22.04
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-windows-cross
      paths:
        - src-tauri/target/
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates
        curl
        file
        build-essential
        pkg-config
        clang
        llvm
        lld
        nsis
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
    - rustup target add x86_64-pc-windows-msvc
    # cargo-xwin downloads the MSVC CRT/SDK headers and drives the cross-link.
    - cargo install --locked cargo-xwin
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    # Honour the "packageManager" field in package.json (pnpm 10.x — pnpm 11
    # requires Node 22.13+, which this image doesn't ship).
    - corepack install
    - pnpm install --frozen-lockfile
  script:
    - *upload_helper
    - . "$CARGO_HOME/env"
    - pnpm tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --config '{"bundle":{"targets":["nsis"]}}'
    - upload_to_registry "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" "quark-${CI_COMMIT_TAG}-windows-x64.exe"
  artifacts:
    name: "quark-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    expire_in: 30 days

# ─── build: macOS ───────────────────────────────────────────────────────────
#
# Requires a macOS shell-executor runner tagged "macos" with Xcode CLT,
# Rust, Node 20, pnpm pre-installed.
#
# Code-signing: set CI/CD variables APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID — Tauri
# will sign & notarise automatically when they are present. Without them the
# build succeeds but the .app is not notarised.
#
# Produces: .dmg, .app (inside a .tar.gz).
#
# DISABLED: no macOS runner is available — macOS bundles are built manually on
# the MacBook. To re-enable, drop the `rules: when: never` below (and restore
# the macOS asset links in the `release` job).

build:macos:
  stage: build
  rules:
    - when: never
  tags:
    - macos
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-macos
      paths:
        - src-tauri/target/
  before_script:
    - rustup update stable
    - pnpm install --frozen-lockfile
  script:
    - *upload_helper
    - pnpm tauri build
    - upload_to_registry "src-tauri/target/release/bundle/dmg/*.dmg"            "quark-${CI_COMMIT_TAG}-macos.dmg"
    - upload_to_registry "src-tauri/target/release/bundle/macos/*.app.tar.gz"   "quark-${CI_COMMIT_TAG}-macos.app.tar.gz"
  artifacts:
    name: "quark-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/dmg/*.dmg
      - src-tauri/target/release/bundle/macos/*.app.tar.gz
    expire_in: 30 days

# ─── build: Android ─────────────────────────────────────────────────────────
#
# Builds an arm64-only release APK via `pnpm tauri android build --apk`.
# (arm64-v8a covers all modern physical devices; a universal APK packing all
# four ABIs ran ~600 MB and exceeded the package-registry proxy's upload limit.)
# Signing: if ANDROID_KEYSTORE_BASE64 + related vars are set, Gradle signs the
# release APK during the build (via the signingConfig in app/build.gradle.kts);
# otherwise it falls back to a debug-signed APK (installable on dev devices,
# NOT suitable for public distribution).
#
# IMPORTANT: use the SAME keystore for every release, forever. Android refuses
# to install an update whose signing certificate differs from the installed
# app ("App not installed" / INSTALL_FAILED_UPDATE_INCOMPATIBLE), forcing users
# to uninstall first. The debug fallback key is regenerated every CI run, so
# debug builds are never upgradeable over one another — release-sign all public
# builds with one permanent, backed-up keystore.
#
# Required CI/CD variables for release signing:
#   ANDROID_KEYSTORE_BASE64    — base64 of your .jks keystore (file-type var ok)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# (the job decodes the keystore to a file and exports ANDROID_KEYSTORE_PATH,
#  which build.gradle.kts reads.)

build:android:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DEBIAN_FRONTEND: noninteractive
    ANDROID_HOME: /opt/android-sdk
    ANDROID_SDK_ROOT: /opt/android-sdk
    NDK_VERSION: "26.1.10909125"
    SDK_PLATFORM: "android-34"
    BUILD_TOOLS_VERSION: "34.0.0"
  cache:
    - <<: *cargo_registry_cache
    - key:
        files:
          - src-tauri/Cargo.lock
        prefix: rust-target-android
      paths:
        - src-tauri/target/
    - key: android-sdk-v1
      paths:
        - .android-sdk-cache/
        - .gradle-cache/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        ca-certificates curl unzip git file
        build-essential pkg-config
    # Restore cached SDK if present.
    - mkdir -p "$ANDROID_HOME"
    - |
      if [ -d .android-sdk-cache ] && [ "$(ls -A .android-sdk-cache 2>/dev/null)" ]; then
        cp -a .android-sdk-cache/. "$ANDROID_HOME/"
      fi
    # Install Android SDK cmdline-tools if not cached.
    - |
      if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
        cd /tmp
        curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        cd "$CI_PROJECT_DIR"
      fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION:$PATH"
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --install
        "platform-tools"
        "platforms;$SDK_PLATFORM"
        "build-tools;$BUILD_TOOLS_VERSION"
        "ndk;$NDK_VERSION"
        >/dev/null
    - export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
    # Persist the SDK to cache for next time.
    - cp -a "$ANDROID_HOME/." .android-sdk-cache/
    # Rust + Android targets.
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
    # arm64-only — covers all modern physical Android devices and keeps the APK
    # small enough to clear the package-registry upload limit (see header note).
    - rustup target add aarch64-linux-android
    # Node + pnpm.
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    # Honour the "packageManager" field in package.json (pnpm 10.x — pnpm 11
    # requires Node 22.13+, which this image doesn't ship).
    - corepack install
    - pnpm install --frozen-lockfile
    # Initialise the Android project (idempotent; safe to re-run).
    - pnpm tauri android init --ci
  script:
    - *upload_helper
    - . "$CARGO_HOME/env"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION:$PATH"
    - export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-cache"
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "Building release APK (release-signed by Gradle)…"
        # Decode the keystore and hand its path to Gradle. The release
        # signingConfig in app/build.gradle.kts reads ANDROID_KEYSTORE_PATH +
        # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD,
        # so `tauri android build` emits a signed, zipaligned APK directly —
        # no separate apksigner step, and the same key is used every release.
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/quark.jks
        export ANDROID_KEYSTORE_PATH=/tmp/quark.jks
        pnpm tauri android build --apk --target aarch64
        SIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" ! -name "*-unsigned.apk" | head -n1)
        rm -f /tmp/quark.jks
        if [ -z "$SIGNED" ]; then
          echo "ERROR: no signed *-release.apk produced. Is the signingConfig wired up in build.gradle.kts?" >&2
          exit 1
        fi
        echo "Found signed APK: $SIGNED"
        # Fail loudly if the APK didn't actually get signed (e.g. signingConfig skipped).
        apksigner verify --print-certs "$SIGNED" | grep -i "Signer #1 certificate SHA-256" \
          || { echo "ERROR: APK is not signed." >&2; exit 1; }
        cp "$SIGNED" quark-android.apk
      else
        echo "No ANDROID_KEYSTORE_BASE64 set — building DEBUG-signed APK."
        echo "  (Installable on dev devices, but NOT suitable for public release —"
        echo "   the debug key is regenerated every CI run, so debug builds can NOT"
        echo "   be installed over one another. Public releases MUST be release-signed.)"
        pnpm tauri android build --apk --debug --target aarch64
        DEBUG_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-debug.apk" | head -n1)
        cp "$DEBUG_APK" quark-android.apk
      fi
    - upload_to_registry "quark-android.apk" "quark-${CI_COMMIT_TAG}-android.apk"
  artifacts:
    name: "quark-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - quark-android.apk
    expire_in: 30 days

# ─── release ────────────────────────────────────────────────────────────────
#
# Creates a GitLab Release whose asset links point to the Generic Package
# Registry. Those URLs are stable (independent of job artifacts) and
# externally downloadable when project visibility allows it.

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:linux
      artifacts: false
    - job: build:windows
      artifacts: false
    - job: build:flatpak
      artifacts: false
    - job: build:android
      artifacts: false
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Quark $CI_COMMIT_TAG"
    description: "Automated release — see CHANGELOG or commit history for details."
    assets:
      links:
        - name: "Linux (.deb, amd64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/quark/${CI_COMMIT_TAG}/quark-${CI_COMMIT_TAG}-linux-amd64.deb"
